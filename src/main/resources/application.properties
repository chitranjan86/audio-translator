# PostgreSQL - DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD are set as env vars in Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-southeast-2
aws.s3.bucketName=audiotranslator-cheta-2026
deepgram.apiKey=${DEEPGRAM_API_KEY}

# raised from 100MB so a ~1hr WAV/FLAC file doesn't get rejected
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# long uploads / long Deepgram calls shouldn't get killed by default timeouts
server.tomcat.connection-timeout=600000
spring.mvc.async.request-timeout=1800000